<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="抗菌薬が細菌・ウイルスに作用するイメージ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#0b3a6b"/>
      <stop offset="38%" stop-color="#1f6fb2"/>
      <stop offset="58%" stop-color="#7fc4e8"/>
      <stop offset="78%" stop-color="#5b4fa8"/>
      <stop offset="100%" stop-color="#2a1c5e"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#cfe9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cfe9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="virion" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#b39ae8"/>
      <stop offset="55%" stop-color="#6d4bb0"/>
      <stop offset="100%" stop-color="#2e1a63"/>
    </radialGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fd39a"/>
      <stop offset="100%" stop-color="#1c6b47"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- 光の筋 -->
  <g opacity="0.35" filter="url(#soft)">
    <path d="M0 210 C300 150 620 250 1200 130" stroke="#dff0ff" stroke-width="16" fill="none"/>
    <path d="M0 470 C280 560 640 430 1200 590" stroke="#bcd9f5" stroke-width="12" fill="none"/>
  </g>

  <!-- 中央のフレア（薬剤が作用する接点） -->
  <ellipse cx="700" cy="380" rx="330" ry="190" fill="url(#flare)"/>

  <!-- 左：薬剤分子（青と白の球の連なり） -->
  <g>
    <g stroke="#cfe6fb" stroke-width="3" opacity="0.75">
      <path d="M70 250 L130 215 L190 245 L150 300 L90 300 Z" fill="none"/>
      <path d="M120 520 L180 490 L240 520 L210 575 L150 575 Z" fill="none"/>
      <path d="M250 350 L320 330 L370 375" fill="none"/>
    </g>
    <g>
      <circle cx="70" cy="250" r="17" fill="#eaf4ff"/>
      <circle cx="130" cy="215" r="14" fill="#4fa8e8"/>
      <circle cx="190" cy="245" r="16" fill="#eaf4ff"/>
      <circle cx="150" cy="300" r="13" fill="#4fa8e8"/>
      <circle cx="90" cy="300" r="15" fill="#9fd0f5"/>
      <circle cx="120" cy="520" r="16" fill="#eaf4ff"/>
      <circle cx="180" cy="490" r="13" fill="#4fa8e8"/>
      <circle cx="240" cy="520" r="15" fill="#9fd0f5"/>
      <circle cx="210" cy="575" r="12" fill="#4fa8e8"/>
      <circle cx="150" cy="575" r="14" fill="#eaf4ff"/>
      <circle cx="250" cy="350" r="15" fill="#4fa8e8"/>
      <circle cx="320" cy="330" r="12" fill="#eaf4ff"/>
      <circle cx="370" cy="375" r="14" fill="#9fd0f5"/>
      <circle cx="300" cy="180" r="11" fill="#4fa8e8"/>
      <circle cx="60" cy="410" r="12" fill="#9fd0f5"/>
      <circle cx="230" cy="180" r="9" fill="#eaf4ff"/>
    </g>
  </g>

  <!-- 中央：拡散する微粒子 -->
  <g fill="#dff0ff">
    <circle cx="410" cy="300" r="9" opacity="0.9"/><circle cx="450" cy="360" r="7" opacity="0.8"/>
    <circle cx="430" cy="430" r="8" opacity="0.85"/><circle cx="490" cy="290" r="6" opacity="0.75"/>
    <circle cx="500" cy="410" r="9" opacity="0.9"/><circle cx="540" cy="345" r="7" opacity="0.8"/>
    <circle cx="560" cy="450" r="6" opacity="0.7"/><circle cx="580" cy="270" r="8" opacity="0.85"/>
    <circle cx="610" cy="390" r="7" opacity="0.8"/><circle cx="640" cy="330" r="6" opacity="0.7"/>
    <circle cx="470" cy="500" r="7" opacity="0.7"/><circle cx="520" cy="220" r="6" opacity="0.65"/>
    <circle cx="380" cy="380" r="6" opacity="0.7"/><circle cx="660" cy="460" r="7" opacity="0.75"/>
    <circle cx="600" cy="510" r="6" opacity="0.6"/><circle cx="690" cy="290" r="6" opacity="0.65"/>
  </g>
  <g fill="#8f7fd6" opacity="0.85">
    <rect x="700" y="300" width="14" height="14" rx="3" transform="rotate(20 707 307)"/>
    <rect x="745" y="380" width="12" height="12" rx="3" transform="rotate(-15 751 386)"/>
    <rect x="690" y="440" width="13" height="13" rx="3" transform="rotate(35 696 446)"/>
    <rect x="780" y="300" width="11" height="11" rx="3" transform="rotate(10 785 305)"/>
    <rect x="760" y="470" width="12" height="12" rx="3" transform="rotate(-25 766 476)"/>
    <rect x="820" y="380" width="10" height="10" rx="3" transform="rotate(45 825 385)"/>
  </g>

  <!-- 右：ウイルス粒子 -->
  <g>
    <g transform="translate(960,330)">
      <g stroke="#4b2f8f" stroke-width="9" stroke-linecap="round">
        <path d="M0 -175 L0 -205"/><path d="M124 -124 L146 -146"/><path d="M175 0 L205 0"/>
        <path d="M124 124 L146 146"/><path d="M0 175 L0 205"/><path d="M-124 124 L-146 146"/>
        <path d="M-175 0 L-205 0"/><path d="M-124 -124 L-146 -146"/>
        <path d="M67 -162 L78 -190"/><path d="M162 -67 L190 -78"/><path d="M162 67 L190 78"/>
        <path d="M67 162 L78 190"/><path d="M-67 162 L-78 190"/><path d="M-162 67 L-190 78"/>
        <path d="M-162 -67 L-190 -78"/><path d="M-67 -162 L-78 -190"/>
      </g>
      <g fill="#3b2478">
        <circle cx="0" cy="-208" r="15"/><circle cx="148" cy="-148" r="14"/><circle cx="208" cy="0" r="15"/>
        <circle cx="148" cy="148" r="14"/><circle cx="0" cy="208" r="15"/><circle cx="-148" cy="148" r="14"/>
        <circle cx="-208" cy="0" r="15"/><circle cx="-148" cy="-148" r="14"/>
        <circle cx="80" cy="-193" r="12"/><circle cx="193" cy="-80" r="12"/><circle cx="193" cy="80" r="12"/>
        <circle cx="80" cy="193" r="12"/><circle cx="-80" cy="193" r="12"/><circle cx="-193" cy="80" r="12"/>
        <circle cx="-193" cy="-80" r="12"/><circle cx="-80" cy="-193" r="12"/>
      </g>
      <circle cx="0" cy="0" r="175" fill="url(#virion)"/>
      <g fill="#ffffff" opacity="0.14">
        <circle cx="-60" cy="-70" r="34"/><circle cx="45" cy="-95" r="20"/><circle cx="70" cy="55" r="26"/>
      </g>
    </g>

    <g transform="translate(1105,640) scale(0.42)">
      <circle cx="0" cy="0" r="150" fill="url(#virion)"/>
      <g stroke="#4b2f8f" stroke-width="16" stroke-linecap="round">
        <path d="M0 -150 L0 -195"/><path d="M106 -106 L138 -138"/><path d="M150 0 L195 0"/>
        <path d="M106 106 L138 138"/><path d="M0 150 L0 195"/><path d="M-106 106 L-138 138"/>
        <path d="M-150 0 L-195 0"/><path d="M-106 -106 L-138 -138"/>
      </g>
    </g>
    <g transform="translate(830,660) scale(0.3)">
      <circle cx="0" cy="0" r="150" fill="url(#virion)"/>
      <g stroke="#5a3aa5" stroke-width="18" stroke-linecap="round">
        <path d="M0 -150 L0 -200"/><path d="M106 -106 L142 -142"/><path d="M150 0 L200 0"/>
        <path d="M0 150 L0 200"/><path d="M-150 0 L-200 0"/><path d="M-106 -106 L-142 -142"/>
      </g>
    </g>
  </g>

  <!-- 桿菌 -->
  <g opacity="0.95">
    <g transform="translate(620,90) rotate(-28)">
      <rect x="-95" y="-30" width="190" height="60" rx="30" fill="url(#rod)"/>
      <path d="M-95 0 C-140 -30 -175 10 -215 -20" stroke="#8fe0b4" stroke-width="4" fill="none" opacity="0.7"/>
    </g>
    <g transform="translate(560,830) rotate(-20)">
      <rect x="-110" y="-34" width="220" height="68" rx="34" fill="url(#rod)"/>
    </g>
    <g transform="translate(1085,110) rotate(35)">
      <rect x="-80" y="-26" width="160" height="52" rx="26" fill="url(#rod)"/>
    </g>
    <g transform="translate(1160,470) rotate(-40)" opacity="0.85">
      <rect x="-70" y="-23" width="140" height="46" rx="23" fill="url(#rod)"/>
    </g>
  </g>
</svg>
