<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e6b63" />
    <meta name="description" content="手稲渓仁会医療センター『抗菌薬投与マニュアル 第9版』の院内向け参照アプリ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="抗菌薬ナビ" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e6b63'/%3E%3Cpath d='M9 20.5 20.5 9M11.5 6.5a5 5 0 0 1 7 7l-5 5a5 5 0 0 1-7-7z' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>抗菌薬投与ナビ</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 更新競合で旧ハッシュのJSだけ読み込めない場合、アプリ用キャッシュを1度だけ
      // 自動修復する。患者条件や免責確認（localStorage）は削除しない。
      (() => {
        const recoveryKey = "abx-navi/chunk-recovery/v1";
        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            if (!(target instanceof HTMLScriptElement) || !/\/assets\/index-[^/]+\.js$/.test(target.src)) return;

            if (sessionStorage.getItem(recoveryKey)) {
              document.getElementById("root").innerHTML =
                '<main style="max-width:640px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif">' +
                '<h1 style="font-size:20px">アプリを更新できませんでした</h1>' +
                '<p>ネットワーク接続を確認して、ブラウザまたはホーム画面のアプリを閉じてから、もう一度開いてください。</p>' +
                '<button onclick="location.reload()" style="padding:10px 16px">再読み込み</button></main>';
              return;
            }

            sessionStorage.setItem(recoveryKey, "1");
            Promise.all([
              "serviceWorker" in navigator
                ? navigator.serviceWorker.getRegistrations().then((items) => {
                    const appScope = new URL("./", document.baseURI).href;
                    return Promise.all(items.filter((item) => item.scope === appScope).map((item) => item.unregister()));
                  })
                : Promise.resolve(),
              "caches" in window
                ? caches.keys().then((names) => Promise.all(names.filter((name) => name.startsWith("abx-navi-")).map((name) => caches.delete(name))))
                : Promise.resolve(),
            ]).finally(() => {
              const url = new URL(location.href);
              url.searchParams.set("recover", Date.now().toString());
              location.replace(url.href);
            });
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
